<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc">
  <title id="title">Approximate position of the cerebellum</title>
  <desc id="desc">A simplified side view of the brain. The cerebrum is shown above, the cerebellum below its rear, and the brain stem descending in front of the cerebellum.</desc>
